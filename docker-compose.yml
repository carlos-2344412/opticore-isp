services:

  postgres:
    image: postgres:17

    container_name: opti_postgres

    restart: always

    environment:
      POSTGRES_DB: opticore
      POSTGRES_USER: opticore
      POSTGRES_PASSWORD: OptiCore2026!

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

    container_name: opti_redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: